name: Carousel slides to Drive

# Rendered slides are committed by the carousel routines. This mirrors whatever
# changed into Google Drive, where Jennica works.
on:
  push:
    branches: [main]
    paths:
      - "graphics/carousels/**"
  workflow_dispatch:
    inputs:
      all:
        description: "Sync every deck, not just changed ones"
        type: boolean
        default: false
      decks:
        description: "Space-separated deck paths to sync (ignored when the box above is ticked)"
        type: string
        default: ""

concurrency:
  group: carousel-drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. A shallow clone does not contain github.event.before
          # once a push carries more than one commit, and the diff below then
          # dies with "fatal: bad object" and silently syncs nothing.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Drive client
        run: pip install --quiet google-api-python-client google-auth google-auth-oauthlib

      - name: Work out which decks changed
        id: decks
        env:
          EVENT_NAME: ${{ github.event_name }}
          SYNC_ALL: ${{ inputs.all }}
          SYNC_DECKS: ${{ inputs.decks }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$SYNC_ALL" = "true" ]; then
              echo "args=--all" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -z "$SYNC_DECKS" ]; then
              echo "::error::A manual run needs either 'Sync every deck' ticked or a deck list in the decks input."
              exit 1
            fi
            echo "args=$SYNC_DECKS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The diff needs github.event.before to be a real commit in this clone.
          # When it is not (branch created, force push, history rewritten) fall
          # back to a full sync. The old version let git fail inside a pipeline,
          # which turned an unreadable diff into an empty deck list and reported
          # "No deck folders changed" while quietly skipping the whole push.
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "::warning::Cannot diff against '$BEFORE'; syncing every deck instead."
            echo "args=--all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Unique deck folders touched by this push.
          DECKS=$(git diff --name-only "$BEFORE" "$AFTER" -- 'graphics/carousels/*/*' \
            | cut -d/ -f1-3 | sort -u | tr '\n' ' ')
          if [ -z "$DECKS" ]; then
            echo "No deck folders changed."
          fi
          echo "args=$DECKS" >> "$GITHUB_OUTPUT"

      - name: Sync to Drive
        if: steps.decks.outputs.args != ''
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DRIVE_CAROUSELS_FOLDER_ID: ${{ secrets.DRIVE_CAROUSELS_FOLDER_ID }}
          SYNC_ARGS: ${{ steps.decks.outputs.args }}
        # Unquoted on purpose: the deck list is space-separated and each word is
        # one argument.
        run: python3 scripts/drive_sync.py $SYNC_ARGS
